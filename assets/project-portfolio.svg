      <text x="70" y="207" fill="#f8fafc" font-size="18" font-weight="800">DecisionOps AI</text>
      <text x="70" y="234" fill="#cbd5e1" font-size="13">Governed enterprise decisions</text><text x="70" y="253" fill="#cbd5e1" font-size="13">with approvals and audit evidence.</text>
