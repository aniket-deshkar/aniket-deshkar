      <text x="350" y="207" fill="#f8fafc" font-size="18" font-weight="800">CareerForge</text>
      <text x="350" y="234" fill="#cbd5e1" font-size="13">Resume-aware interview prep</text><text x="350" y="253" fill="#cbd5e1" font-size="13">and job-search operations backend.</text>
