<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Aniket Deshkar project portfolio</title>
  <desc id="desc">Twelve projects across enterprise AI platforms, Java and agent infrastructure, and FinTech agent systems.</desc>
  <defs>
