      <stop offset="0" stop-color="#0b1120"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="1200" height="810" rx="24" fill="url(#bg)"/>
