<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Aniket Deshkar professional engineering profile</title>
  <desc id="desc">Assistant Lead AI Engineer with more than four and a half years of backend and AI engineering experience, specializing in Agentic AI, Java, Python, and FinTech systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#60a5fa" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#334155" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="56" cy="48" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="53" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="2">PROFESSIONAL SNAPSHOT</text>

    <text x="56" y="112" fill="#f8fafc" font-size="38" font-weight="800">Assistant Lead AI Engineer</text>
    <rect x="56" y="132" width="590" height="3" rx="2" fill="url(#accent)"/>
    <text x="56" y="174" fill="#e2e8f0" font-size="19" font-weight="600">Backend engineer building production-grade</text>
    <text x="56" y="201" fill="#e2e8f0" font-size="19" font-weight="600">Agentic AI systems for enterprise operations.</text>
    <text x="56" y="239" fill="#94a3b8" font-size="16">I combine Java/Spring platform engineering with Python agent runtimes</text>
    <text x="56" y="265" fill="#94a3b8" font-size="16">to build secure, durable, and observable enterprise workflows.</text>

    <text x="56" y="309" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.7">ENGINEERING FOCUS</text>
    <g font-size="13" font-weight="700">
      <rect x="56" y="328" width="188" height="34" rx="17" fill="#0c4a6e"/><text x="77" y="350" fill="#bae6fd">MULTI-AGENT SYSTEMS</text>
      <rect x="256" y="328" width="145" height="34" rx="17" fill="#312e81"/><text x="279" y="350" fill="#e0e7ff">SECURE RAG</text>
      <rect x="413" y="328" width="171" height="34" rx="17" fill="#4c1d95"/><text x="436" y="350" fill="#ede9fe">AI GOVERNANCE</text>
      <rect x="56" y="375" width="135" height="34" rx="17" fill="#14532d"/><text x="80" y="397" fill="#dcfce7">VOICE AI</text>
      <rect x="203" y="375" width="112" height="34" rx="17" fill="#0f3d55"/><text x="232" y="397" fill="#bae6fd">MCP</text>
      <rect x="327" y="375" width="180" height="34" rx="17" fill="#3b265e"/><text x="350" y="397" fill="#ede9fe">OBSERVABILITY</text>
    </g>

    <g>
      <rect x="714" y="70" width="200" height="132" rx="18" fill="#111c2f" stroke="#38bdf8" stroke-opacity="0.48"/>
      <text x="740" y="113" fill="#38bdf8" font-size="32" font-weight="800">4.5+</text>
      <text x="740" y="145" fill="#f8fafc" font-size="15" font-weight="700">YEARS</text>
      <text x="740" y="171" fill="#94a3b8" font-size="13">Backend + AI engineering</text>

      <rect x="934" y="70" width="210" height="132" rx="18" fill="#18172f" stroke="#a78bfa" stroke-opacity="0.48"/>
      <text x="960" y="113" fill="#a78bfa" font-size="22" font-weight="800">JAVA + PYTHON</text>
      <text x="960" y="145" fill="#f8fafc" font-size="15" font-weight="700">CORE STACK</text>
      <text x="960" y="171" fill="#94a3b8" font-size="13">Spring · FastAPI · APIs</text>

      <rect x="714" y="222" width="200" height="132" rx="18" fill="#18172f" stroke="#a78bfa" stroke-opacity="0.48"/>
      <text x="740" y="265" fill="#a78bfa" font-size="27" font-weight="800">AGENTIC AI</text>
      <text x="740" y="297" fill="#f8fafc" font-size="15" font-weight="700">SPECIALIZATION</text>
      <text x="740" y="323" fill="#94a3b8" font-size="13">Agents · RAG · MCP · HITL</text>

      <rect x="934" y="222" width="210" height="132" rx="18" fill="#10251f" stroke="#22c55e" stroke-opacity="0.48"/>
      <text x="960" y="265" fill="#4ade80" font-size="27" font-weight="800">FINTECH</text>
      <text x="960" y="297" fill="#f8fafc" font-size="15" font-weight="700">DOMAIN</text>
      <text x="960" y="323" fill="#94a3b8" font-size="13">Payments · Risk · Operations</text>
