<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="title description">
  <title id="title">Production delivery loop</title>
  <desc id="description">Discover, design, build, evaluate, and operate connected in a continuous engineering loop.</desc>
  <defs>
    <linearGradient id="progress" x1="0" x2="1"><stop stop-color="#ff7b72"/><stop offset=".28" stop-color="#58a6ff"/><stop offset=".56" stop-color="#3fb950"/><stop offset=".78" stop-color="#bc8cff"/><stop offset="1" stop-color="#d29922"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .runner { offset-path:path('M140 73H1060'); animation:travel 8s ease-in-out infinite; }
    .trace { stroke-dasharray:230 690; animation:flow 8s ease-in-out infinite; }
    @keyframes travel { 0% { offset-distance:0%; } 100% { offset-distance:100%; } }
    @keyframes flow { 0% { stroke-dashoffset:230; } 100% { stroke-dashoffset:-690; } }
    @media (prefers-reduced-motion: reduce) { .runner,.trace { animation:none; } }
  </style>
  <rect x="1" y="1" width="1198" height="154" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="32" y="31" fill="#768390" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.3">DELIVERY LOOP / CONTINUOUS FEEDBACK</text>
  <path d="M140 73H1060" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>
  <path class="trace" d="M140 73H1060" stroke="url(#progress)" stroke-width="5" stroke-linecap="round"/>
  <circle class="runner" r="8" fill="#f0f6fc" filter="url(#glow)"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle">
    <circle cx="140" cy="73" r="9" fill="#ff7b72"/><text x="140" y="119" fill="#b1bac4" font-size="12">DISCOVER</text>
    <circle cx="370" cy="73" r="9" fill="#58a6ff"/><text x="370" y="119" fill="#b1bac4" font-size="12">DESIGN</text>
    <circle cx="600" cy="73" r="9" fill="#3fb950"/><text x="600" y="119" fill="#b1bac4" font-size="12">BUILD</text>
    <circle cx="830" cy="73" r="9" fill="#bc8cff"/><text x="830" y="119" fill="#b1bac4" font-size="12">EVALUATE</text>
    <circle cx="1060" cy="73" r="9" fill="#d29922"/><text x="1060" y="119" fill="#b1bac4" font-size="12">OPERATE</text>
  </g>
</svg>
