<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Aniket Deshkar technology landscape</title>
  <desc id="desc">Technologies grouped across backend engineering, agentic AI, data and messaging, cloud integrations, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/><rect width="1200" height="500" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#334155" stroke-width="2"/>
