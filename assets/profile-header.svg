<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Aniket Deshkar — Applied AI and backend systems</title>
  <desc id="description">A dark engineering console with animated signals converging on a governed AI core.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070d14"/>
      <stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop stop-color="#3fb950" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1b2735" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .signal { stroke-dasharray: 5 15; animation: signal 8s linear infinite; }
    .orbit { transform-origin: 923px 180px; animation: rotate 32s linear infinite; }
    .orbit-reverse { transform-origin: 923px 180px; animation: rotateReverse 23s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
    .blink { animation: blink 1.2s steps(1,end) infinite; }
    @keyframes signal { to { stroke-dashoffset: -80; } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes rotateReverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.82); } 50% { opacity:1; transform:scale(1.18); } }
    @keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:.12; } }
    @media (prefers-reduced-motion: reduce) { .signal,.orbit,.orbit-reverse,.pulse,.blink { animation:none; } }
  </style>
  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity=".72"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#263341" stroke-width="2"/>
  <path d="M0 48H1200" stroke="#263341"/>
  <circle cx="25" cy="24" r="5" fill="#ff7b72"/>
  <circle cx="44" cy="24" r="5" fill="#d29922"/>
  <circle cx="63" cy="24" r="5" fill="#3fb950"/>
  <text x="88" y="29" fill="#768390" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">aniket@engineering-profile:~</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="54" y="91" fill="#ff7b72" font-size="13" letter-spacing="1.3">ANIKET / ENGINEERING PROFILE</text>
    <text x="54" y="139" fill="#f0f6fc" font-size="30" font-weight="700">Aniket Deshkar</text>
    <text x="54" y="187" fill="#58a6ff" font-size="15" letter-spacing="1">APPLIED AI &amp; BACKEND SYSTEMS</text>
    <text x="54" y="226" fill="#b1bac4" font-size="17">I build governed AI that survives production.</text>
    <text x="54" y="278" fill="#3fb950" font-size="15">&gt; orchestrate · evaluate · observe · scale</text>
    <rect class="blink" x="442" y="263" width="8" height="19" rx="1" fill="#3fb950"/>
    <text x="54" y="321" fill="#57606a" font-size="12" letter-spacing="1.4">FORWARD-DEPLOYED ENGINEERING  /  HUMAN-IN-THE-LOOP  /  AUDITABLE BY DESIGN</text>
  </g>
  <g fill="none" stroke="#253445" stroke-width="1.2">
    <path d="M548 92L923 180M684 63L923 180M707 304L923 180M548 269L923 180M1023 82L923 180M1102 282L923 180"/>
    <circle cx="923" cy="180" r="60"/><circle cx="923" cy="180" r="101"/><circle cx="923" cy="180" r="141"/>
  </g>
  <g fill="none" stroke-width="1.4" opacity=".65">
    <path class="signal" d="M548 92L923 180" stroke="#ff7b72"/>
    <path class="signal" d="M684 63L923 180" stroke="#58a6ff" style="animation-delay:-2s"/>
    <path class="signal" d="M707 304L923 180" stroke="#d29922" style="animation-delay:-4s"/>
    <path class="signal" d="M1023 82L923 180" stroke="#58a6ff" style="animation-delay:-6s"/>
  </g>
  <circle cx="923" cy="180" r="32" fill="url(#coreGlow)"/>
  <circle class="pulse" cx="923" cy="180" r="17" fill="#07120b" stroke="#3fb950" stroke-width="2" filter="url(#softGlow)"/>
  <circle cx="923" cy="180" r="5" fill="#f0f6fc"/>
  <g class="orbit" fill="#0d1117" stroke-width="2">
    <circle cx="923" cy="39" r="6" stroke="#58a6ff" fill="#58a6ff"/><circle cx="1064" cy="180" r="5" stroke="#ff7b72" fill="#ff7b72"/>
  </g>
  <g class="orbit-reverse" fill="#0d1117" stroke-width="2">
    <circle cx="923" cy="79" r="6" stroke="#d29922" fill="#d29922"/><circle cx="822" cy="180" r="5" stroke="#3fb950" fill="#3fb950"/>
  </g>
  <g>
    <circle cx="548" cy="92" r="6" fill="#ff7b72"/><circle cx="684" cy="63" r="6" fill="#58a6ff"/><circle cx="707" cy="304" r="6" fill="#d29922"/>
    <circle cx="548" cy="269" r="5" fill="#3fb950"/><circle cx="1023" cy="82" r="6" fill="#58a6ff"/><circle cx="1102" cy="282" r="5" fill="#d29922"/>
  </g>
</svg>
