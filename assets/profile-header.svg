<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">Aniket Deshkar — AI and backend engineering</title>
  <desc id="description">A dark banner with a softly animated network of connected nodes. Java, Python, and distributed systems.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142638"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#72e4cd"/><stop offset="1" stop-color="#88baff"/></linearGradient>
  </defs>
  <style>
    .flow { stroke-dasharray: 9 19; animation: travel 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    .late { animation-delay: -2.5s; }
    @keyframes travel { to { stroke-dashoffset: -112; } }
    @keyframes breathe { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: .85; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .flow,.pulse { animation: none; } }
  </style>
  <rect width="960" height="240" rx="16" fill="url(#bg)"/>
  <rect x="32" y="40" width="3" height="160" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="58" y="70" fill="#72e4cd" font-size="12" letter-spacing="2.5">AI &amp; BACKEND ENGINEERING</text>
    <text x="56" y="126" fill="#f0f5fb" font-size="43" font-weight="650">Aniket Deshkar</text>
    <text x="58" y="163" fill="#c0ccdc" font-size="17">Agents, APIs, and the systems behind them.</text>
    <text x="58" y="197" fill="#91a4ba" font-size="13" letter-spacing="1">JAVA / PYTHON / DISTRIBUTED SYSTEMS</text>
  </g>
  <g fill="none" stroke="#314b64" stroke-width="1.5">
    <path d="M657 120 L737 58 L822 120 L902 58 M657 120 L737 182 L822 120 L902 182 M737 58 L737 182 M822 120 L902 120"/>
  </g>
  <path class="flow" d="M657 120 L737 58 L822 120 L902 58 M657 120 L737 182 L822 120 L902 182" fill="none" stroke="#72e4cd" stroke-width="1.5" opacity=".65"/>
  <g fill="#112334" stroke="#88baff" stroke-width="1.5">
    <circle cx="657" cy="120" r="7"/><circle cx="737" cy="58" r="7"/>
    <circle cx="737" cy="182" r="7"/><circle cx="822" cy="120" r="10"/>
    <circle cx="902" cy="58" r="5"/><circle cx="902" cy="120" r="5"/><circle cx="902" cy="182" r="5"/>
  </g>
  <circle class="pulse" cx="822" cy="120" r="20" fill="none" stroke="#72e4cd"/>
  <circle class="pulse late" cx="657" cy="120" r="14" fill="none" stroke="#88baff"/>
</svg>
